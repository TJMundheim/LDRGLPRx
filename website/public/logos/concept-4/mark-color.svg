<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Tree of 4M: stylized tree with 4 main branches -->
  <!-- Trunk -->
  <rect x="120" y="148" width="16" height="88" rx="6" fill="#8B4513"/>
  <!-- Ground roots -->
  <path d="M120,230 Q100,244 76,238" fill="none" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
  <path d="M136,230 Q156,244 180,238" fill="none" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
  <!-- Left lower branch -->
  <path d="M122,200 Q90,186 64,168" fill="none" stroke="#6B7C3A" stroke-width="6" stroke-linecap="round"/>
  <!-- Right lower branch -->
  <path d="M134,200 Q166,186 192,168" fill="none" stroke="#6B7C3A" stroke-width="6" stroke-linecap="round"/>
  <!-- Left upper branch -->
  <path d="M124,172 Q96,148 76,124" fill="none" stroke="#5A6E2B" stroke-width="5" stroke-linecap="round"/>
  <!-- Right upper branch -->
  <path d="M132,172 Q160,148 180,124" fill="none" stroke="#5A6E2B" stroke-width="5" stroke-linecap="round"/>
  <!-- Foliage clusters — terracotta/olive/sage tones -->
  <!-- Top center canopy -->
  <ellipse cx="128" cy="80" rx="52" ry="48" fill="#556B2F" opacity="0.9"/>
  <!-- Left upper -->
  <ellipse cx="68" cy="112" rx="32" ry="28" fill="#8B7355" opacity="0.85"/>
  <!-- Right upper -->
  <ellipse cx="188" cy="112" rx="32" ry="28" fill="#6B8E5A" opacity="0.85"/>
  <!-- Left lower -->
  <ellipse cx="56" cy="156" rx="28" ry="24" fill="#CD853F" opacity="0.8"/>
  <!-- Right lower -->
  <ellipse cx="200" cy="156" rx="28" ry="24" fill="#6B7C3A" opacity="0.8"/>
  <!-- Subtle "M" at center canopy -->
  <text x="128" y="90" font-family="'Inter',Arial,sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="rgba(255,255,255,0.5)">M</text>
</svg>
