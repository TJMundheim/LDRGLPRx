<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Concept 13 Mono -->
  <!-- Outer square frame -->
  <rect x="28" y="28" width="200" height="200" fill="none" stroke="#222" stroke-width="2" opacity="0.4"/>
  <!-- Circle -->
  <circle cx="128" cy="118" r="88" fill="none" stroke="#222" stroke-width="2" opacity="0.5"/>
  <!-- Body torso -->
  <line x1="128" y1="72" x2="128" y2="148" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="128" cy="64" r="11" fill="none" stroke="#111" stroke-width="2.5"/>
  <!-- Arms spread -->
  <line x1="128" y1="82" x2="64" y2="98" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="82" x2="192" y2="98" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arms horizontal -->
  <line x1="128" y1="90" x2="52" y2="90" stroke="#111" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="128" y1="90" x2="204" y2="90" stroke="#111" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Legs spread -->
  <line x1="128" y1="148" x2="88" y2="196" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="148" x2="168" y2="196" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs narrow -->
  <line x1="128" y1="148" x2="108" y2="198" stroke="#111" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="128" y1="148" x2="148" y2="198" stroke="#111" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- N Cardinal M -->
  <circle cx="128" cy="23" r="11" fill="#111"/>
  <text x="128" y="27.5" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="white">M</text>
  <!-- E Cardinal M -->
  <circle cx="236" cy="118" r="9" fill="#444"/>
  <text x="236" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="white">M</text>
  <!-- S Cardinal M -->
  <circle cx="128" cy="231" r="9" fill="#444"/>
  <text x="128" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="white">M</text>
  <!-- W Cardinal M -->
  <circle cx="20" cy="118" r="9" fill="#444"/>
  <text x="20" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="white">M</text>
</svg>
