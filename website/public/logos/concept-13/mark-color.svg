<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Concept 13: Classic Vitruvian + 4 Cardinal M Markers -->
  <!-- Background: warm parchment -->
  <rect width="256" height="256" fill="#f5f0e8"/>

  <!-- Outer square frame -->
  <rect x="28" y="28" width="200" height="200" fill="none" stroke="#8b7355" stroke-width="2" opacity="0.5"/>

  <!-- Circle -->
  <circle cx="128" cy="118" r="88" fill="none" stroke="#8b7355" stroke-width="2" opacity="0.7"/>

  <!-- Vitruvian Man figure (simplified) -->
  <!-- Body torso -->
  <line x1="128" y1="72" x2="128" y2="148" stroke="#3d2b1f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="128" cy="64" r="11" fill="none" stroke="#3d2b1f" stroke-width="2.5"/>

  <!-- Arms spread wide (upper position) -->
  <line x1="128" y1="82" x2="64" y2="98" stroke="#3d2b1f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="82" x2="192" y2="98" stroke="#3d2b1f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arms horizontal (lower position — slightly lower) -->
  <line x1="128" y1="90" x2="52" y2="90" stroke="#3d2b1f" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="128" y1="90" x2="204" y2="90" stroke="#3d2b1f" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Legs spread (wide stance) -->
  <line x1="128" y1="148" x2="88" y2="196" stroke="#3d2b1f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="148" x2="168" y2="196" stroke="#3d2b1f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Legs straight (narrow stance, slightly inset) -->
  <line x1="128" y1="148" x2="108" y2="198" stroke="#3d2b1f" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="128" y1="148" x2="148" y2="198" stroke="#3d2b1f" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Horizontal shoulder line -->
  <line x1="110" y1="86" x2="146" y2="86" stroke="#3d2b1f" stroke-width="1.5" opacity="0.4"/>
  <!-- Hip line -->
  <line x1="112" y1="132" x2="144" y2="132" stroke="#3d2b1f" stroke-width="1.5" opacity="0.4"/>

  <!-- 4 Cardinal M Markers -->

  <!-- NORTH — Mind (gold accent, slightly larger) -->
  <g transform="translate(128, 23)">
    <circle r="12" fill="#d4a017" opacity="0.9"/>
    <text x="0" y="4.5" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="white">M</text>
    <text x="0" y="21" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="600" fill="#d4a017" letter-spacing="0.5">Mind</text>
  </g>

  <!-- EAST — Muscle (graphite) -->
  <g transform="translate(236, 118)">
    <circle r="10" fill="#5a7a8c" opacity="0.85"/>
    <text x="0" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="white">M</text>
    <text x="0" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="6.5" font-weight="600" fill="#5a7a8c">Muscle</text>
  </g>

  <!-- SOUTH — Mitigate (graphite) -->
  <g transform="translate(128, 231)">
    <circle r="10" fill="#5a7a8c" opacity="0.85"/>
    <text x="0" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="white">M</text>
    <text x="0" y="-14" text-anchor="middle" font-family="Georgia, serif" font-size="6.5" font-weight="600" fill="#5a7a8c">Mitigate</text>
  </g>

  <!-- WEST — Motivate (graphite) -->
  <g transform="translate(20, 118)">
    <circle r="10" fill="#5a7a8c" opacity="0.85"/>
    <text x="0" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="white">M</text>
    <text x="0" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="6.5" font-weight="600" fill="#5a7a8c">Motivate</text>
  </g>
</svg>
