<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="c9l-underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22c55e"/>
      <stop offset="80%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Pure wordmark lockup: mark IS the wordmark -->
  <!-- Centered in the 800×220 frame -->
  <text x="60" y="125" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="90" font-weight="800" fill="#1a1a2e" letter-spacing="-3">My</text>
  <text x="228" y="129" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="96" font-weight="900" fill="#16a34a" letter-spacing="-3">4M</text>
  <text x="430" y="125" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="90" font-weight="800" fill="#1a1a2e" letter-spacing="-3">Life</text>

  <!-- Green underline accent under 4M -->
  <rect x="228" y="137" width="200" height="4" rx="2" fill="url(#c9l-underline)"/>

  <!-- Tagline, centered under wordmark -->
  <text x="400" y="178" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="300" fill="#6b7280" text-anchor="middle" letter-spacing="2">Begin with the end in mind.</text>
</svg>
