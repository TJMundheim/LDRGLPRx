<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Concept 17: Vitruvian + Golden Ratio spiral overlay -->
  <!-- Warm sepia + gold. Thin spiral lines semi-transparent, 4M marks at intersection points. -->

  <rect width="256" height="256" fill="#f9f4ec"/>

  <!-- Outer square -->
  <rect x="22" y="22" width="212" height="212" fill="none" stroke="#c9a86c" stroke-width="1.5" opacity="0.5"/>

  <!-- Main circle -->
  <circle cx="128" cy="118" r="92" fill="none" stroke="#c9a86c" stroke-width="1.5" opacity="0.6"/>

  <!-- Golden ratio spiral approximation using arcs -->
  <!-- Fibonacci-like arc sequence (quarter-circle arcs of decreasing radius) centered around figure -->
  <!-- Large quarter arc, r=92 -->
  <path d="M 128 26 A 92 92 0 0 1 220 118" fill="none" stroke="#c9a86c" stroke-width="1" opacity="0.55"/>
  <!-- Next quarter, r=57 -->
  <path d="M 220 118 A 57 57 0 0 1 163 175" fill="none" stroke="#c9a86c" stroke-width="1" opacity="0.5"/>
  <!-- Next, r=35 -->
  <path d="M 163 175 A 35 35 0 0 1 128 140" fill="none" stroke="#c9a86c" stroke-width="1" opacity="0.45"/>
  <!-- Next, r=22 -->
  <path d="M 128 140 A 22 22 0 0 1 106 118" fill="none" stroke="#c9a86c" stroke-width="1" opacity="0.4"/>
  <!-- Next, r=13 -->
  <path d="M 106 118 A 13 13 0 0 1 119 105" fill="none" stroke="#c9a86c" stroke-width="1" opacity="0.35"/>
  <!-- Tiny center arc -->
  <path d="M 119 105 A 8 8 0 0 1 128 113" fill="none" stroke="#c9a86c" stroke-width="0.8" opacity="0.3"/>

  <!-- Additional concentric guides (very faint) -->
  <circle cx="128" cy="118" r="57" fill="none" stroke="#c9a86c" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 5"/>
  <circle cx="128" cy="118" r="35" fill="none" stroke="#c9a86c" stroke-width="0.8" opacity="0.25" stroke-dasharray="2 4"/>

  <!-- Vitruvian figure (warm sepia) -->
  <line x1="128" y1="72" x2="128" y2="148" stroke="#6b4c2a" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="128" cy="62" r="10" fill="none" stroke="#6b4c2a" stroke-width="2.2"/>
  <line x1="128" y1="80" x2="65" y2="97" stroke="#6b4c2a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="128" y1="80" x2="191" y2="97" stroke="#6b4c2a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="128" y1="88" x2="50" y2="88" stroke="#6b4c2a" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <line x1="128" y1="88" x2="206" y2="88" stroke="#6b4c2a" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <line x1="128" y1="148" x2="88" y2="196" stroke="#6b4c2a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="128" y1="148" x2="168" y2="196" stroke="#6b4c2a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="128" y1="148" x2="108" y2="198" stroke="#6b4c2a" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <line x1="128" y1="148" x2="148" y2="198" stroke="#6b4c2a" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <line x1="110" y1="84" x2="146" y2="84" stroke="#6b4c2a" stroke-width="1" opacity="0.35"/>
  <line x1="112" y1="130" x2="144" y2="130" stroke="#6b4c2a" stroke-width="1" opacity="0.35"/>

  <!-- 4M marks at spiral/circle intersections -->
  <!-- MIND — top of circle (also top of first arc) -->
  <circle cx="128" cy="26" r="9" fill="#d4a017"/>
  <text x="128" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="white">M</text>
  <text x="128" y="17" text-anchor="middle" font-family="Georgia, serif" font-size="6" fill="#d4a017" font-weight="700">MIND</text>

  <!-- MUSCLE — where spiral reaches right of circle ~(220, 118) -->
  <circle cx="220" cy="118" r="8" fill="#8c5a2a"/>
  <text x="220" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="white">M</text>

  <!-- MITIGATE — bottom spiral point ~(163, 175) -->
  <circle cx="163" cy="175" r="8" fill="#4a7a5a"/>
  <text x="163" y="179" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="white">M</text>

  <!-- MOTIVATE — left ~(36, 118) -->
  <circle cx="36" cy="118" r="8" fill="#8c5a2a"/>
  <text x="36" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="white">M</text>
</svg>
