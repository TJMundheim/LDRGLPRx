<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="c7-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b72"/>
    </radialGradient>
    <radialGradient id="c7-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer decorative ring -->
  <circle cx="128" cy="128" r="122" fill="none" stroke="#c7972a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="#c7972a" stroke-width="0.5" opacity="0.3"/>

  <!-- Three outer arc segments (Muscle / Mitigate / Motivate) — 120° each, leaving Mind's space -->
  <!-- Muscle arc — top-right, 30° to 150° -->
  <path d="M128,128 L218,78 A100,100 0 0,1 218,178 Z" fill="#fbbf24" opacity="0.15"/>
  <path d="M218,78 A100,100 0 0,1 218,178" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

  <!-- Mitigate arc — bottom, 150° to 270° -->
  <path d="M128,128 L218,178 A100,100 0 0,1 38,178 Z" fill="#34d399" opacity="0.12"/>
  <path d="M218,178 A100,100 0 0,1 38,178" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>

  <!-- Motivate arc — top-left, 270° to 390°/30° -->
  <path d="M128,128 L38,178 A100,100 0 0,1 38,78 Z" fill="#f97316" opacity="0.12"/>
  <path d="M38,178 A100,100 0 0,1 38,78" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>

  <!-- Mind arc — top, 30° to -30° (shortest path through top) — dominant -->
  <path d="M38,78 A100,100 0 0,1 218,78" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>

  <!-- Arc labels (small, elegant) -->
  <text font-family="Georgia,serif" font-size="8" fill="#fbbf24" text-anchor="middle">
    <textPath href="#arc-muscle" startOffset="50%">MUSCLE</textPath>
  </text>

  <!-- Filigree dots at arc termini -->
  <circle cx="218" cy="78" r="5" fill="#fbbf24"/>
  <circle cx="218" cy="178" r="5" fill="#34d399"/>
  <circle cx="38" cy="178" r="5" fill="#f97316"/>
  <circle cx="38" cy="78" r="5" fill="#6366f1"/>

  <!-- Small tick marks on outer ring at each quadrant -->
  <line x1="128" y1="6" x2="128" y2="14" stroke="#c7972a" stroke-width="1.5" opacity="0.7"/>
  <line x1="250" y1="128" x2="242" y2="128" stroke="#c7972a" stroke-width="1.5" opacity="0.7"/>
  <line x1="128" y1="250" x2="128" y2="242" stroke="#c7972a" stroke-width="1.5" opacity="0.7"/>
  <line x1="6" y1="128" x2="14" y2="128" stroke="#c7972a" stroke-width="1.5" opacity="0.7"/>

  <!-- Central Mind circle — dominant -->
  <circle cx="128" cy="128" r="52" fill="url(#c7-center)"/>
  <circle cx="128" cy="128" r="52" fill="url(#c7-glow)"/>
  <circle cx="128" cy="128" r="52" fill="none" stroke="#c7972a" stroke-width="2"/>

  <!-- Inner filigree ring inside center -->
  <circle cx="128" cy="128" r="44" fill="none" stroke="#c7972a" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.6"/>

  <!-- Bold central M letterform -->
  <text x="128" y="143" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#f8f4e8" text-anchor="middle" letter-spacing="-1">M</text>

  <!-- MIND label below M in center -->
  <text x="128" y="158" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="600" fill="#c7972a" text-anchor="middle" letter-spacing="3">MIND</text>

  <!-- Outer pillar labels at arc midpoints -->
  <!-- Muscle: right side midpoint ~128° arc mid = right -->
  <text x="210" y="130" font-family="'Helvetica Neue',Arial,sans-serif" font-size="7.5" font-weight="600" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">MUSCLE</text>
  <!-- Mitigate: bottom -->
  <text x="128" y="218" font-family="'Helvetica Neue',Arial,sans-serif" font-size="7.5" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="1.5">MITIGATE</text>
  <!-- Motivate: left -->
  <text x="46" y="130" font-family="'Helvetica Neue',Arial,sans-serif" font-size="7.5" font-weight="600" fill="#f97316" text-anchor="middle" letter-spacing="1.5">MOTIVATE</text>
</svg>
