<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <radialGradient id="lk7-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b72"/>
    </radialGradient>
  </defs>

  <!-- Mark (scaled to ~180px at left) -->
  <g transform="translate(20,20) scale(0.703)">
    <!-- Outer ring -->
    <circle cx="128" cy="128" r="122" fill="none" stroke="#c7972a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    <!-- Arcs -->
    <path d="M218,78 A100,100 0 0,1 218,178" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M218,178 A100,100 0 0,1 38,178" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <path d="M38,178 A100,100 0 0,1 38,78" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <path d="M38,78 A100,100 0 0,1 218,78" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
    <!-- Terminus dots -->
    <circle cx="218" cy="78" r="5" fill="#fbbf24"/>
    <circle cx="218" cy="178" r="5" fill="#34d399"/>
    <circle cx="38" cy="178" r="5" fill="#f97316"/>
    <circle cx="38" cy="78" r="5" fill="#6366f1"/>
    <!-- Central circle -->
    <circle cx="128" cy="128" r="52" fill="url(#lk7-center)"/>
    <circle cx="128" cy="128" r="52" fill="none" stroke="#c7972a" stroke-width="2"/>
    <circle cx="128" cy="128" r="44" fill="none" stroke="#c7972a" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.6"/>
    <!-- M -->
    <text x="128" y="143" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#f8f4e8" text-anchor="middle" letter-spacing="-1">M</text>
    <text x="128" y="158" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="600" fill="#c7972a" text-anchor="middle" letter-spacing="3">MIND</text>
  </g>

  <!-- Wordmark -->
  <text x="230" y="105" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="#1e1b72" letter-spacing="-1">My<tspan fill="#6366f1">4M</tspan>Life</text>

  <!-- Tagline -->
  <text x="232" y="142" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="300" fill="#6b7280" letter-spacing="1">Begin with the end in mind.</text>
</svg>
