<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Concept 18: Negative-Space Hybrid -->
  <!-- 4 overlapping leaf/arc shapes in 4 shades of forest green, each representing one M -->
  <!-- The center white negative space reveals a Vitruvian figure silhouette -->

  <rect width="256" height="256" fill="#1a2a1e"/>

  <!-- Four leaf/petal arcs — each a thick circular arc segment forming a petal shape -->
  <!-- Top petal = Mind -->
  <path d="M 128 128 C 80 80 80 28 128 28 C 176 28 176 80 128 128 Z" fill="#2d6a4f" opacity="0.9"/>
  <!-- Right petal = Muscle -->
  <path d="M 128 128 C 176 80 228 80 228 128 C 228 176 176 176 128 128 Z" fill="#40916c" opacity="0.85"/>
  <!-- Bottom petal = Mitigate -->
  <path d="M 128 128 C 176 176 176 228 128 228 C 80 228 80 176 128 128 Z" fill="#52b788" opacity="0.8"/>
  <!-- Left petal = Motivate -->
  <path d="M 128 128 C 80 176 28 176 28 128 C 28 80 80 80 128 128 Z" fill="#74c69d" opacity="0.75"/>

  <!-- Vitruvian figure in white (the negative space revealed in the center region) -->
  <!-- The figure is white, centered at 128,128, scaled to fit the center -->
  <!-- Head -->
  <circle cx="128" cy="90" r="9" fill="white" opacity="0.92"/>
  <!-- Neck + torso -->
  <rect x="125.5" y="99" width="5" height="36" rx="2" fill="white" opacity="0.92"/>
  <!-- Shoulder width bar -->
  <rect x="108" y="103" width="40" height="3.5" rx="1.5" fill="white" opacity="0.85"/>
  <!-- Arms (two diagonal lines) -->
  <line x1="128" y1="106" x2="102" y2="116" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.88"/>
  <line x1="128" y1="106" x2="154" y2="116" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.88"/>
  <!-- Legs (V) -->
  <line x1="128" y1="135" x2="113" y2="162" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.88"/>
  <line x1="128" y1="135" x2="143" y2="162" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.88"/>
  <!-- Hip bar -->
  <rect x="114" y="130" width="28" height="3" rx="1.5" fill="white" opacity="0.75"/>

  <!-- Label dots with M (subtle, at petal tips) -->
  <!-- Top/Mind -->
  <text x="128" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.85)">MIND</text>
  <!-- Right/Muscle -->
  <text x="213" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="700" fill="rgba(255,255,255,0.75)">MUSCLE</text>
  <!-- Bottom/Mitigate -->
  <text x="128" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="700" fill="rgba(255,255,255,0.75)">MITIGATE</text>
  <!-- Left/Motivate -->
  <text x="43" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="700" fill="rgba(255,255,255,0.7)">MOTIVATE</text>
</svg>
