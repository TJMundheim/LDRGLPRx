<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Variant 2 App Icon — ultra minimal, scales to 32px -->
  <rect width="64" height="64" rx="14" fill="#f8f7f4"/>

  <!-- Square outline -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#2d2d2d" stroke-width="0.8" opacity="0.25"/>

  <!-- Circle -->
  <circle cx="32" cy="30" r="26" fill="none" stroke="#2d2d2d" stroke-width="0.9" opacity="0.4"/>

  <!-- Fibonacci spiral — 3 arcs for clarity at small size -->
  <path d="M 32 4 A 26 26 0 0 1 58 30" fill="none" stroke="#2d2d2d" stroke-width="1.2" opacity="0.55"/>
  <path d="M 58 30 A 16 16 0 0 1 42 46" fill="none" stroke="#2d2d2d" stroke-width="1.2" opacity="0.5"/>
  <path d="M 42 46 A 10 10 0 0 1 32 36" fill="none" stroke="#2d2d2d" stroke-width="1.1" opacity="0.45"/>
  <path d="M 32 36 A 6 6 0 0 1 26 30" fill="none" stroke="#2d2d2d" stroke-width="0.9" opacity="0.4"/>

  <!-- Minimal figure silhouette -->
  <ellipse cx="32" cy="12" rx="4" ry="4.5" fill="none" stroke="#2d2d2d" stroke-width="1.1"/>
  <line x1="32" y1="16" x2="32" y2="35" stroke="#2d2d2d" stroke-width="1.1"/>
  <line x1="32" y1="21" x2="18" y2="26" stroke="#2d2d2d" stroke-width="1"/>
  <line x1="32" y1="21" x2="46" y2="26" stroke="#2d2d2d" stroke-width="1"/>
  <line x1="32" y1="21" x2="11" y2="10" stroke="#2d2d2d" stroke-width="0.9" opacity="0.5"/>
  <line x1="32" y1="21" x2="53" y2="10" stroke="#2d2d2d" stroke-width="0.9" opacity="0.5"/>
  <line x1="32" y1="35" x2="23" y2="52" stroke="#2d2d2d" stroke-width="1"/>
  <line x1="32" y1="35" x2="41" y2="52" stroke="#2d2d2d" stroke-width="1"/>

  <!-- Gold MIND dot at top -->
  <circle cx="32" cy="5" r="4.5" fill="#d4a017"/>
  <text x="32" y="8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="4.5" font-weight="700" fill="white">M</text>

  <!-- Other 3 tiny markers -->
  <circle cx="58" cy="30" r="2.5" fill="#2d2d2d"/>
  <circle cx="42" cy="46" r="2.5" fill="#2d2d2d"/>
  <circle cx="26" cy="30" r="2.5" fill="#2d2d2d"/>
</svg>
