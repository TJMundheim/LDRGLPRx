<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Variant 1 App Icon: 64×64, simplified for legibility -->
  <rect width="64" height="64" rx="14" fill="#f5edd6"/>

  <!-- Circle -->
  <circle cx="32" cy="30" r="25" fill="none" stroke="#8b6340" stroke-width="0.8" opacity="0.5"/>

  <!-- Fibonacci spiral (simplified 3 arcs for icon size) -->
  <path d="M 32 6 A 24 24 0 0 1 56 30" fill="none" stroke="#d4a017" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 56 30 A 15 15 0 0 1 41 45" fill="none" stroke="#d4a017" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 41 45 A 9 9 0 0 1 32 36" fill="none" stroke="#d4a017" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 32 36 A 6 6 0 0 1 26 30" fill="none" stroke="#d4a017" stroke-width="1" stroke-linecap="round"/>

  <!-- Simplified figure -->
  <ellipse cx="32" cy="12" rx="4" ry="4.5" fill="none" stroke="#5c3618" stroke-width="1.3"/>
  <line x1="32" y1="17" x2="32" y2="36" stroke="#5c3618" stroke-width="1.3"/>
  <line x1="32" y1="20" x2="20" y2="26" stroke="#5c3618" stroke-width="1.2"/>
  <line x1="32" y1="20" x2="44" y2="26" stroke="#5c3618" stroke-width="1.2"/>
  <!-- Arms angled up -->
  <line x1="32" y1="20" x2="10" y2="10" stroke="#5c3618" stroke-width="1.1" opacity="0.6"/>
  <line x1="32" y1="20" x2="54" y2="10" stroke="#5c3618" stroke-width="1.1" opacity="0.6"/>
  <line x1="32" y1="36" x2="24" y2="52" stroke="#5c3618" stroke-width="1.2"/>
  <line x1="32" y1="36" x2="40" y2="52" stroke="#5c3618" stroke-width="1.2"/>

  <!-- Mind marker at top -->
  <circle cx="32" cy="5" r="5" fill="#d4a017"/>
  <text x="32" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="5" font-weight="bold" fill="white">M</text>
</svg>
