<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Variant 1: True Fibonacci Spiral + Anatomical Vitruvian, Renaissance palette -->
  <!-- True Fibonacci spiral: unit=7, sequence 1,1,2,3,5,8,13,21 -->
  <!-- Canvas anchor: spiral origin top-center, navel at golden-ratio point -->
  <!-- Fibonacci rects (unit=7): 7,7,14,21,35,56,91,147 -->
  <!-- Spiral built from successive quarter-arc pivots -->

  <!-- Parchment background -->
  <rect width="256" height="256" fill="#f5edd6"/>
  <!-- Subtle texture vignette -->
  <radialGradient id="v1vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#c9a47a" stop-opacity="0.18"/>
  </radialGradient>
  <rect width="256" height="256" fill="url(#v1vignette)"/>

  <!-- Outer Vitruvian square -->
  <rect x="18" y="12" width="220" height="220" fill="none" stroke="#8b6340" stroke-width="1" opacity="0.4"/>

  <!-- Main Vitruvian circle: centered at (128,118), r=100 -->
  <circle cx="128" cy="118" r="100" fill="none" stroke="#8b6340" stroke-width="1" opacity="0.45"/>

  <!-- === TRUE FIBONACCI SPIRAL ===
       Using quarter-circle arcs. Each arc pivots from corner of its Fibonacci rectangle.
       Scale: unit=7px
       Fib sequence applied: 13,8,5,3,2,1,1 (large to small for the spiral winding inward)
       Radii: 91,56,35,21,14,7,7 pixels
       Pivot arrangement: spiral grows from bottom-left going counter-clockwise outward,
       or we draw from outermost to innermost.

       Origin: navel point at golden ratio of body = (128, 130)
       Spiral winds clockwise outward from that center.

       Arc 1: r=91, pivot at (128-91, 130) = (37, 130), from (37,39) to (128,130) → quarter from top to right
       Arc 2: r=56, pivot at (128, 130+56) = (128, 186), from (128,130) to (184,186) quarter top to right
       Arc 3: r=35, pivot at (128+35, 186) = (163,186), from (184,186) to (163,221) quarter right to bottom
       Arc 4: r=21, pivot at (163, 221-21)=(163,200), from (163,221) to (142,200) quarter bottom to left
       Arc 5: r=13, pivot at (142-13,200)=(129,200), from (142,200) to (129,187) quarter left to top
       Arc 6: r=8, pivot at (129,187+8)=(129,195)... getting too complex — use clean version:

       Clean clockwise Fibonacci spiral anchored at navel (128,130):
  -->

  <!-- Fibonacci spiral — true quarter-arc construction -->
  <!-- Largest arc: r=96, center=(32,130), arc from (32,34) to (128,130) — top-to-right -->
  <path d="M 128 34 A 96 96 0 0 1 224 130" fill="none" stroke="#d4a017" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <!-- r=59 (96×0.618), center=(224,130+59)=(224,189), arc from (224,130) to (165,189) — right-to-bottom -->
  <path d="M 224 130 A 59 59 0 0 1 165 189" fill="none" stroke="#d4a017" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- r=37 (59×0.618≈36), center=(165-37,189)=(128,189), arc from (165,189) to (128,152) — bottom-to-left -->
  <path d="M 165 189 A 37 37 0 0 1 128 152" fill="none" stroke="#d4a017" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
  <!-- r=23 (37×0.618≈23), center=(128,152-23)=(128,129), arc from (128,152) to (105,129) — left-to-top -->
  <path d="M 128 152 A 23 23 0 0 1 105 129" fill="none" stroke="#d4a017" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- r=14, center=(105+14,129)=(119,129), arc from (105,129) to (119,115) -->
  <path d="M 105 129 A 14 14 0 0 1 119 115" fill="none" stroke="#d4a017" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
  <!-- r=9, center=(119,115+9)=(119,124), arc from (119,115) to (128,124) -->
  <path d="M 119 115 A 9 9 0 0 1 128 124" fill="none" stroke="#d4a017" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- r=5, center=(128+5,124)=(133,124), arc from (128,124) to (133,129) -->
  <path d="M 128 124 A 5 5 0 0 1 133 129" fill="none" stroke="#d4a017" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>

  <!-- Faint Fibonacci rectangle guides -->
  <rect x="32" y="34" width="96" height="96" fill="none" stroke="#c9a86c" stroke-width="0.6" opacity="0.3" stroke-dasharray="3 5"/>
  <rect x="128" y="34" width="96" height="96" fill="none" stroke="#c9a86c" stroke-width="0.6" opacity="0.25" stroke-dasharray="2 4"/>
  <rect x="128" y="130" width="96" height="59" fill="none" stroke="#c9a86c" stroke-width="0.6" opacity="0.2" stroke-dasharray="2 4"/>

  <!-- === ANATOMICAL VITRUVIAN FIGURE === -->
  <!-- Body proportions: head = 1/8 body height; navel at golden section -->
  <!-- Total figure height: ~180px (y=28 top of head to y=208 feet) -->
  <!-- Head center: (128, 40), r=14 -->
  <!-- Navel: (128, 130) — golden ratio point of body -->
  <!-- Shoulder line: y=75, width ~84px (shoulder to shoulder) -->
  <!-- Hip line: y=145, width ~52px -->
  <!-- Knee: y=178 -->
  <!-- Feet: y=208 -->

  <!-- HEAD — proper oval for cranium -->
  <ellipse cx="128" cy="40" rx="13" ry="14" fill="none" stroke="#5c3618" stroke-width="1.8"/>
  <!-- Chin/jaw indication -->
  <path d="M 119 50 Q 128 56 137 50" fill="none" stroke="#5c3618" stroke-width="1.2" opacity="0.6"/>
  <!-- Neck -->
  <line x1="124" y1="54" x2="122" y2="64" stroke="#5c3618" stroke-width="1.6"/>
  <line x1="132" y1="54" x2="134" y2="64" stroke="#5c3618" stroke-width="1.6"/>

  <!-- TORSO -->
  <!-- Shoulders -->
  <line x1="122" y1="64" x2="86" y2="74" stroke="#5c3618" stroke-width="1.8"/>
  <line x1="134" y1="64" x2="170" y2="74" stroke="#5c3618" stroke-width="1.8"/>
  <!-- Chest line down to hip -->
  <path d="M 86 74 Q 80 100 84 145" fill="none" stroke="#5c3618" stroke-width="1.6"/>
  <path d="M 170 74 Q 176 100 172 145" fill="none" stroke="#5c3618" stroke-width="1.6"/>
  <!-- Clavicle line -->
  <line x1="86" y1="74" x2="170" y2="74" stroke="#5c3618" stroke-width="1.2" opacity="0.5"/>
  <!-- Sternum -->
  <line x1="128" y1="66" x2="128" y2="110" stroke="#5c3618" stroke-width="1.2" opacity="0.4"/>
  <!-- Navel mark -->
  <circle cx="128" cy="130" r="2.5" fill="#5c3618" opacity="0.7"/>
  <!-- Hip line -->
  <line x1="84" y1="145" x2="172" y2="145" stroke="#5c3618" stroke-width="1.5" opacity="0.6"/>

  <!-- ARMS EXTENDED POSITION (horizontal) -->
  <!-- Left arm extended -->
  <line x1="86" y1="74" x2="28" y2="88" stroke="#5c3618" stroke-width="1.5" opacity="0.5"/>
  <!-- elbow roughly midway -->
  <line x1="28" y1="88" x2="22" y2="110" stroke="#5c3618" stroke-width="1.3" opacity="0.45"/>
  <!-- Right arm extended -->
  <line x1="170" y1="74" x2="228" y2="88" stroke="#5c3618" stroke-width="1.5" opacity="0.5"/>
  <line x1="228" y1="88" x2="234" y2="110" stroke="#5c3618" stroke-width="1.3" opacity="0.45"/>

  <!-- ARMS ANGLED (45° up) position -->
  <!-- Left arm angled -->
  <line x1="86" y1="74" x2="38" y2="38" stroke="#5c3618" stroke-width="1.8"/>
  <line x1="38" y1="38" x2="24" y2="26" stroke="#5c3618" stroke-width="1.5"/>
  <!-- Right arm angled -->
  <line x1="170" y1="74" x2="218" y2="38" stroke="#5c3618" stroke-width="1.8"/>
  <line x1="218" y1="38" x2="232" y2="26" stroke="#5c3618" stroke-width="1.5"/>

  <!-- LEGS APART POSITION -->
  <!-- Left leg -->
  <line x1="84" y1="145" x2="72" y2="178" stroke="#5c3618" stroke-width="1.8"/>
  <line x1="72" y1="178" x2="62" y2="208" stroke="#5c3618" stroke-width="1.6"/>
  <!-- Right leg -->
  <line x1="172" y1="145" x2="184" y2="178" stroke="#5c3618" stroke-width="1.8"/>
  <line x1="184" y1="178" x2="194" y2="208" stroke="#5c3618" stroke-width="1.6"/>

  <!-- LEGS TOGETHER POSITION -->
  <!-- Left leg together -->
  <line x1="84" y1="145" x2="82" y2="178" stroke="#5c3618" stroke-width="1.4" opacity="0.5"/>
  <line x1="82" y1="178" x2="80" y2="208" stroke="#5c3618" stroke-width="1.3" opacity="0.45"/>
  <!-- Right leg together -->
  <line x1="172" y1="145" x2="174" y2="178" stroke="#5c3618" stroke-width="1.4" opacity="0.5"/>
  <line x1="174" y1="178" x2="176" y2="208" stroke="#5c3618" stroke-width="1.3" opacity="0.45"/>

  <!-- Foot indications -->
  <line x1="56" y1="208" x2="68" y2="208" stroke="#5c3618" stroke-width="1.4"/>
  <line x1="188" y1="208" x2="200" y2="208" stroke="#5c3618" stroke-width="1.4"/>

  <!-- === 4M MARKERS at spiral/circle intersections === -->
  <!-- MIND — top of circle, spiral start (128, 34) — GOLD, largest -->
  <circle cx="128" cy="28" r="13" fill="#d4a017"/>
  <circle cx="128" cy="28" r="11" fill="none" stroke="#f5edd6" stroke-width="1.5"/>
  <text x="128" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="700" fill="white" letter-spacing="1">MIND</text>
  <text x="128" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="white">M</text>

  <!-- MUSCLE — right intersection (224, 130) -->
  <circle cx="228" cy="130" r="10" fill="#6b4c2a"/>
  <text x="228" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="6" fill="white" letter-spacing="0.5">MUSC</text>
  <text x="228" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="white">M</text>

  <!-- MITIGATE — bottom intersection (165, 189) -->
  <circle cx="165" cy="193" r="10" fill="#4a6b4a"/>
  <text x="165" y="189" text-anchor="middle" font-family="Georgia, serif" font-size="5.5" fill="white" letter-spacing="0.3">MITIG</text>
  <text x="165" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="white">M</text>

  <!-- MOTIVATE — left intersection (128, 152) -->
  <circle cx="96" cy="155" r="10" fill="#6b4c2a"/>
  <text x="96" y="151" text-anchor="middle" font-family="Georgia, serif" font-size="5" fill="white" letter-spacing="0.3">MOTIV</text>
  <text x="96" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="white">M</text>
</svg>
