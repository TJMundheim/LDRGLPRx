<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Variant 1 Mono: Warm umber on near-white -->
  <rect width="256" height="256" fill="#f8f4ee"/>

  <!-- Outer square -->
  <rect x="18" y="12" width="220" height="220" fill="none" stroke="#3d2410" stroke-width="0.8" opacity="0.35"/>
  <!-- Vitruvian circle -->
  <circle cx="128" cy="118" r="100" fill="none" stroke="#3d2410" stroke-width="0.8" opacity="0.4"/>

  <!-- True Fibonacci spiral in dark umber -->
  <path d="M 128 34 A 96 96 0 0 1 224 130" fill="none" stroke="#3d2410" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 224 130 A 59 59 0 0 1 165 189" fill="none" stroke="#3d2410" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 165 189 A 37 37 0 0 1 128 152" fill="none" stroke="#3d2410" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 128 152 A 23 23 0 0 1 105 129" fill="none" stroke="#3d2410" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 105 129 A 14 14 0 0 1 119 115" fill="none" stroke="#3d2410" stroke-width="1" stroke-linecap="round"/>
  <path d="M 119 115 A 9 9 0 0 1 128 124" fill="none" stroke="#3d2410" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Anatomical figure in dark umber -->
  <ellipse cx="128" cy="40" rx="13" ry="14" fill="none" stroke="#3d2410" stroke-width="1.8"/>
  <path d="M 119 50 Q 128 56 137 50" fill="none" stroke="#3d2410" stroke-width="1.2" opacity="0.5"/>
  <line x1="124" y1="54" x2="122" y2="64" stroke="#3d2410" stroke-width="1.6"/>
  <line x1="132" y1="54" x2="134" y2="64" stroke="#3d2410" stroke-width="1.6"/>
  <line x1="122" y1="64" x2="86" y2="74" stroke="#3d2410" stroke-width="1.8"/>
  <line x1="134" y1="64" x2="170" y2="74" stroke="#3d2410" stroke-width="1.8"/>
  <path d="M 86 74 Q 80 100 84 145" fill="none" stroke="#3d2410" stroke-width="1.5"/>
  <path d="M 170 74 Q 176 100 172 145" fill="none" stroke="#3d2410" stroke-width="1.5"/>
  <line x1="86" y1="74" x2="170" y2="74" stroke="#3d2410" stroke-width="1" opacity="0.4"/>
  <circle cx="128" cy="130" r="2" fill="#3d2410" opacity="0.7"/>
  <line x1="84" y1="145" x2="172" y2="145" stroke="#3d2410" stroke-width="1.3" opacity="0.5"/>
  <line x1="86" y1="74" x2="28" y2="88" stroke="#3d2410" stroke-width="1.3" opacity="0.45"/>
  <line x1="28" y1="88" x2="22" y2="110" stroke="#3d2410" stroke-width="1.1" opacity="0.4"/>
  <line x1="170" y1="74" x2="228" y2="88" stroke="#3d2410" stroke-width="1.3" opacity="0.45"/>
  <line x1="228" y1="88" x2="234" y2="110" stroke="#3d2410" stroke-width="1.1" opacity="0.4"/>
  <line x1="86" y1="74" x2="38" y2="38" stroke="#3d2410" stroke-width="1.8"/>
  <line x1="38" y1="38" x2="24" y2="26" stroke="#3d2410" stroke-width="1.4"/>
  <line x1="170" y1="74" x2="218" y2="38" stroke="#3d2410" stroke-width="1.8"/>
  <line x1="218" y1="38" x2="232" y2="26" stroke="#3d2410" stroke-width="1.4"/>
  <line x1="84" y1="145" x2="72" y2="178" stroke="#3d2410" stroke-width="1.8"/>
  <line x1="72" y1="178" x2="62" y2="208" stroke="#3d2410" stroke-width="1.6"/>
  <line x1="172" y1="145" x2="184" y2="178" stroke="#3d2410" stroke-width="1.8"/>
  <line x1="184" y1="178" x2="194" y2="208" stroke="#3d2410" stroke-width="1.6"/>
  <line x1="84" y1="145" x2="82" y2="178" stroke="#3d2410" stroke-width="1.2" opacity="0.4"/>
  <line x1="82" y1="178" x2="80" y2="208" stroke="#3d2410" stroke-width="1.1" opacity="0.35"/>
  <line x1="172" y1="145" x2="174" y2="178" stroke="#3d2410" stroke-width="1.2" opacity="0.4"/>
  <line x1="174" y1="178" x2="176" y2="208" stroke="#3d2410" stroke-width="1.1" opacity="0.35"/>
  <line x1="56" y1="208" x2="68" y2="208" stroke="#3d2410" stroke-width="1.3"/>
  <line x1="188" y1="208" x2="200" y2="208" stroke="#3d2410" stroke-width="1.3"/>

  <!-- 4M markers in umber/dark -->
  <circle cx="128" cy="28" r="12" fill="#3d2410"/>
  <text x="128" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#f8f4ee">M</text>
  <circle cx="228" cy="130" r="8" fill="#3d2410"/>
  <text x="228" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="#f8f4ee">M</text>
  <circle cx="165" cy="193" r="8" fill="#3d2410"/>
  <text x="165" y="197" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="#f8f4ee">M</text>
  <circle cx="96" cy="155" r="8" fill="#3d2410"/>
  <text x="96" y="159" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="#f8f4ee">M</text>
</svg>
