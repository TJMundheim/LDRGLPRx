<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <!-- Variant 4 Lockup: Living Vitruvian — sepia bg, glow from mind -->
  <defs>
    <radialGradient id="v4lock-glow" cx="24%" cy="15%" r="25%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="520" height="140" fill="#f2e8d0"/>
  <rect width="520" height="140" fill="url(#v4lock-glow)"/>

  <!-- Mark scaled -->
  <g transform="translate(8, 8) scale(0.43)">
    <circle cx="128" cy="118" r="100" fill="none" stroke="#8b6340" stroke-width="1" opacity="0.35"/>
    <!-- Glow from head -->
    <circle cx="128" cy="40" r="20" fill="none" stroke="#ffd700" stroke-width="3" opacity="0.3"/>
    <!-- Fibonacci spiral in gold -->
    <path d="M 128 34 A 96 96 0 0 1 224 130" fill="none" stroke="#d4a017" stroke-width="2.8" stroke-linecap="round" opacity="0.9"/>
    <path d="M 224 130 A 59 59 0 0 1 165 189" fill="none" stroke="#d4a017" stroke-width="2.4" stroke-linecap="round" opacity="0.82"/>
    <path d="M 165 189 A 37 37 0 0 1 128 152" fill="none" stroke="#d4a017" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 128 152 A 23 23 0 0 1 105 129" fill="none" stroke="#d4a017" stroke-width="1.6" stroke-linecap="round" opacity="0.68"/>
    <path d="M 105 129 A 14 14 0 0 1 119 115" fill="none" stroke="#d4a017" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 119 115 A 9 9 0 0 1 128 124" fill="none" stroke="#d4a017" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
    <!-- Figure -->
    <ellipse cx="128" cy="40" rx="13" ry="14" fill="#fdf5dc" stroke="#5c3618" stroke-width="1.8"/>
    <path d="M 120 37 Q 123 32 128 34 Q 133 32 136 37 Q 136 42 128 43 Q 120 42 120 37 Z" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.7"/>
    <line x1="124" y1="54" x2="122" y2="64" stroke="#5c3618" stroke-width="1.7"/>
    <line x1="132" y1="54" x2="134" y2="64" stroke="#5c3618" stroke-width="1.7"/>
    <line x1="122" y1="64" x2="86" y2="74" stroke="#5c3618" stroke-width="1.7"/>
    <line x1="134" y1="64" x2="170" y2="74" stroke="#5c3618" stroke-width="1.7"/>
    <path d="M 86 74 Q 80 100 84 145" fill="none" stroke="#5c3618" stroke-width="1.6"/>
    <path d="M 170 74 Q 176 100 172 145" fill="none" stroke="#5c3618" stroke-width="1.6"/>
    <circle cx="128" cy="130" r="3" fill="#d4a017" opacity="0.8"/>
    <line x1="86" y1="74" x2="38" y2="38" stroke="#5c3618" stroke-width="1.7"/>
    <line x1="170" y1="74" x2="218" y2="38" stroke="#5c3618" stroke-width="1.7"/>
    <line x1="86" y1="74" x2="28" y2="92" stroke="#5c3618" stroke-width="1.2" opacity="0.45"/>
    <line x1="170" y1="74" x2="228" y2="92" stroke="#5c3618" stroke-width="1.2" opacity="0.45"/>
    <line x1="84" y1="145" x2="172" y2="145" stroke="#5c3618" stroke-width="1.3" opacity="0.5"/>
    <line x1="84" y1="145" x2="58" y2="210" stroke="#5c3618" stroke-width="1.6"/>
    <line x1="172" y1="145" x2="198" y2="210" stroke="#5c3618" stroke-width="1.6"/>
    <line x1="110" y1="145" x2="108" y2="210" stroke="#5c3618" stroke-width="1.1" opacity="0.4"/>
    <line x1="146" y1="145" x2="148" y2="210" stroke="#5c3618" stroke-width="1.1" opacity="0.4"/>
    <!-- 4M dots on spiral -->
    <circle cx="128" cy="34" r="6" fill="#d4a017"/>
    <circle cx="224" cy="130" r="5.5" fill="#d4a017" opacity="0.9"/>
    <circle cx="165" cy="189" r="5" fill="#d4a017" opacity="0.8"/>
    <circle cx="105" cy="129" r="4.5" fill="#d4a017" opacity="0.75"/>
  </g>

  <!-- Divider -->
  <line x1="126" y1="20" x2="126" y2="120" stroke="#8b6340" stroke-width="1" opacity="0.3"/>

  <!-- Wordmark — warm sepia/umber -->
  <text x="144" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#3d2410" letter-spacing="-0.5">My4MLife</text>

  <!-- Gold tagline -->
  <text x="144" y="80" font-family="Georgia, serif" font-size="10.5" fill="#a07840" font-style="italic" letter-spacing="0.5">Begin with the end in mind.</text>

  <!-- Subtle emphasis on MIND in pillar line -->
  <text x="144" y="104" font-family="Georgia, serif" font-size="8" fill="#d4a017" letter-spacing="2" font-weight="700">MIND</text>
  <text x="187" y="104" font-family="Georgia, serif" font-size="8" fill="#8b6340" letter-spacing="1.5"> · MUSCLE · MITIGATE · MOTIVATE</text>
</svg>
