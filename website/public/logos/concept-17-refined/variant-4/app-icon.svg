<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Variant 4 App Icon: golden brain-glow from head, spiral unfurls -->
  <defs>
    <radialGradient id="v4icon-glow" cx="50%" cy="18%" r="40%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#f2e8d0"/>
  <rect width="64" height="64" rx="14" fill="url(#v4icon-glow)"/>

  <!-- Fibonacci spiral originates from head -->
  <path d="M 32 8 A 24 24 0 0 1 56 32" fill="none" stroke="#d4a017" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 56 32 A 15 15 0 0 1 41 47" fill="none" stroke="#d4a017" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M 41 47 A 9 9 0 0 1 32 38" fill="none" stroke="#d4a017" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 32 38 A 6 6 0 0 1 26 32" fill="none" stroke="#d4a017" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 26 32 A 4 4 0 0 1 30 28" fill="none" stroke="#d4a017" stroke-width="1" stroke-linecap="round"/>

  <!-- Head glow ring -->
  <circle cx="32" cy="11" r="8" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4"/>

  <!-- Head -->
  <ellipse cx="32" cy="11" rx="5" ry="5.5" fill="#fdf5dc" stroke="#5c3618" stroke-width="1.3"/>
  <!-- Brain lobe hint -->
  <path d="M 29 10 Q 30.5 8 32 9 Q 33.5 8 35 10 Q 35 12.5 32 13 Q 29 12.5 29 10 Z" fill="none" stroke="#d4a017" stroke-width="0.8" opacity="0.7"/>

  <!-- Body -->
  <line x1="32" y1="17" x2="32" y2="36" stroke="#5c3618" stroke-width="1.3"/>
  <line x1="32" y1="21" x2="18" y2="27" stroke="#5c3618" stroke-width="1.2"/>
  <line x1="32" y1="21" x2="46" y2="27" stroke="#5c3618" stroke-width="1.2"/>
  <line x1="32" y1="21" x2="11" y2="11" stroke="#5c3618" stroke-width="1.1" opacity="0.55"/>
  <line x1="32" y1="21" x2="53" y2="11" stroke="#5c3618" stroke-width="1.1" opacity="0.55"/>
  <line x1="32" y1="36" x2="22" y2="54" stroke="#5c3618" stroke-width="1.2"/>
  <line x1="32" y1="36" x2="42" y2="54" stroke="#5c3618" stroke-width="1.2"/>
  <line x1="32" y1="36" x2="30" y2="54" stroke="#5c3618" stroke-width="0.9" opacity="0.4"/>
  <line x1="32" y1="36" x2="34" y2="54" stroke="#5c3618" stroke-width="0.9" opacity="0.4"/>

  <!-- Navel gold dot -->
  <circle cx="32" cy="32" r="1.5" fill="#d4a017" opacity="0.8"/>

  <!-- Gold dot markers on spiral -->
  <circle cx="32" cy="8" r="3.5" fill="#d4a017"/>
  <circle cx="56" cy="32" r="2.5" fill="#d4a017" opacity="0.85"/>
  <circle cx="41" cy="47" r="2" fill="#d4a017" opacity="0.75"/>
</svg>
