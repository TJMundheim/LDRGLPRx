<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Cyclic Flow: four arcs forming a continuous circle, each representing one M -->
  <defs>
    <linearGradient id="arc1g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7C66"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
    <linearGradient id="arc2g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#C9A22A"/>
    </linearGradient>
    <linearGradient id="arc3g" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A22A"/>
      <stop offset="100%" stop-color="#E05A20"/>
    </linearGradient>
    <linearGradient id="arc4g" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E05A20"/>
      <stop offset="100%" stop-color="#0E7C66"/>
    </linearGradient>
  </defs>
  <!-- Four arcs, each ~80deg sweep with gaps, stroke-based, thick -->
  <!-- Arc 1 (top-right): Mitigate — teal→green -->
  <path d="M 128,28 A 100,100 0 0,1 228,128" fill="none" stroke="url(#arc1g)" stroke-width="18" stroke-linecap="round"/>
  <!-- Arc 2 (bottom-right): Muscle — green→gold -->
  <path d="M 228,128 A 100,100 0 0,1 128,228" fill="none" stroke="url(#arc2g)" stroke-width="18" stroke-linecap="round"/>
  <!-- Arc 3 (bottom-left): Mind — gold→orange -->
  <path d="M 128,228 A 100,100 0 0,1 28,128" fill="none" stroke="url(#arc3g)" stroke-width="18" stroke-linecap="round"/>
  <!-- Arc 4 (top-left): Motivate — orange→teal -->
  <path d="M 28,128 A 100,100 0 0,1 128,28" fill="none" stroke="url(#arc4g)" stroke-width="18" stroke-linecap="round"/>
  <!-- Center text -->
  <text x="128" y="122" font-family="'Inter',Arial,sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#0E7C66">4M</text>
  <text x="128" y="142" font-family="'Inter',Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#555" letter-spacing="2">LIFE</text>
</svg>
