<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <circle cx="128" cy="128" r="124" fill="none" stroke="#000" stroke-width="1" opacity="0.1"/>

  <!-- Spiral segments — all black, varying opacity to suggest progression -->
  <path d="M128,96 A32,32 0 0,1 160,128" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M160,128 A62,62 0 0,1 128,190" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <path d="M128,190 A92,92 0 0,1 36,128" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <path d="M36,128 A118,118 0 0,1 128,10" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M128,10 A8,8 0 0,1 136,18" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Inner m and outer M -->
  <text x="128" y="134" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#000" text-anchor="middle" opacity="0.5"/>
  <text x="128" y="36" font-family="Georgia,serif" font-size="32" font-weight="800" fill="#000" text-anchor="middle">M</text>
  <text x="128" y="134" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#000" text-anchor="middle" opacity="0.4">m</text>
</svg>
