<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ai8-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#0d1f2d"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="1024" height="1024" rx="230" fill="url(#ai8-bg)"/>

  <!-- Scaled spiral: center ~512,512, scale from 256×256 to 1024×1024 = ×4 -->
  <!-- Original arc centers shift proportionally. Simple scale transform: -->
  <g transform="translate(0,0) scale(4)">
    <!-- viewBox origin shift: original SVG 0,0 → needs centering -->
    <!-- Original spiral is already ~centered at 128,128 in 256×256 -->
    <!-- Scale ×4 fills 1024×1024, just translate to (0,0) -->
    <path d="M128,96 A32,32 0 0,1 160,128" fill="none" stroke="#0d9488" stroke-width="9" stroke-linecap="round"/>
    <path d="M160,128 A62,62 0 0,1 128,190" fill="none" stroke="#16a34a" stroke-width="9" stroke-linecap="round"/>
    <path d="M128,190 A92,92 0 0,1 36,128" fill="none" stroke="#ca8a04" stroke-width="9" stroke-linecap="round"/>
    <path d="M36,128 A118,118 0 0,1 128,10" fill="none" stroke="#ea580c" stroke-width="9" stroke-linecap="round"/>
    <path d="M128,10 A8,8 0 0,1 136,18" fill="none" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/>
    <!-- Inner small M -->
    <text x="128" y="138" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#0d9488" text-anchor="middle">m</text>
    <!-- Outer large M at top -->
    <text x="128" y="44" font-family="Georgia,serif" font-size="40" font-weight="800" fill="#0d9488" text-anchor="middle">M</text>
  </g>
</svg>
