<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Quadrant Mandala — circle with 4 quadrants each containing an M -->
  <clipPath id="q1"><path d="M128,128 L128,16 A112,112 0 0,1 240,128 Z"/></clipPath>
  <clipPath id="q2"><path d="M128,128 L240,128 A112,112 0 0,1 128,240 Z"/></clipPath>
  <clipPath id="q3"><path d="M128,128 L128,240 A112,112 0 0,1 16,128 Z"/></clipPath>
  <clipPath id="q4"><path d="M128,128 L16,128 A112,112 0 0,1 128,16 Z"/></clipPath>

  <!-- Quadrant fills -->
  <circle cx="128" cy="128" r="112" fill="none"/>
  <path d="M128,128 L128,16 A112,112 0 0,1 240,128 Z" fill="#1a6b56"/>
  <path d="M128,128 L240,128 A112,112 0 0,1 128,240 Z" fill="#1a4a8c"/>
  <path d="M128,128 L128,240 A112,112 0 0,1 16,128 Z" fill="#b8860b"/>
  <path d="M128,128 L16,128 A112,112 0 0,1 128,16 Z" fill="#8b4513"/>

  <!-- M letterforms in each quadrant, white -->
  <!-- Q1 (top right) — Mitigate -->
  <text x="168" y="92" font-family="'Inter',Arial,sans-serif" font-size="30" font-weight="900" text-anchor="middle" fill="white" opacity="0.9">M</text>
  <!-- Q2 (bottom right) — Muscle -->
  <text x="186" y="182" font-family="'Inter',Arial,sans-serif" font-size="30" font-weight="900" text-anchor="middle" fill="white" opacity="0.9">M</text>
  <!-- Q3 (bottom left) — Mind -->
  <text x="90" y="182" font-family="'Inter',Arial,sans-serif" font-size="30" font-weight="900" text-anchor="middle" fill="white" opacity="0.9">M</text>
  <!-- Q4 (top left) — Motivate -->
  <text x="90" y="92" font-family="'Inter',Arial,sans-serif" font-size="30" font-weight="900" text-anchor="middle" fill="white" opacity="0.9">M</text>

  <!-- Dividing lines -->
  <line x1="128" y1="16" x2="128" y2="240" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="16" y1="128" x2="240" y2="128" stroke="white" stroke-width="2" opacity="0.6"/>

  <!-- Center dot -->
  <circle cx="128" cy="128" r="10" fill="white"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>
