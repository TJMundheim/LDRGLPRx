name: CountYourselfSkinny
options:
  bundleIdPrefix: com.my4mlife
  deploymentTarget:
    iOS: "17.0"
targets:
  CountYourselfSkinny:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        # The short name under the icon. The App Store name stays "Count Yourself Skinny".
        CFBundleDisplayName: Count Skinny
        # The version lives in MARKETING_VERSION and CURRENT_PROJECT_VERSION below, nowhere else.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMotionUsageDescription: "Motion access lets your AirPods count chews during meals. Chew motion is processed on your phone and never leaves it."
        NSHealthShareUsageDescription: "Step count is read from Health to fill in your daily steps automatically."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.my4mlife.countyourselfskinny
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        # Personal-team device builds: TJ picks his own Apple ID team in Xcode
        # (Signing & Capabilities → Team). Left empty on purpose so the checked-in
        # project doesn't pin a team id.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        # Debug is the build Dr. TJ installs with a free Apple ID: no HealthKit entitlement,
        # and its own bundle id, so a personal team never claims the App Store id.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/CountYourselfSkinny.Debug.entitlements
          PRODUCT_BUNDLE_IDENTIFIER: com.my4mlife.countyourselfskinny.dev
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/CountYourselfSkinny.entitlements
  CountYourselfSkinnyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: CountYourselfSkinny.storekit
        buildPhase: resources
    dependencies:
      - target: CountYourselfSkinny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.my4mlife.countyourselfskinny.tests
        GENERATE_INFOPLIST_FILE: YES
  CountYourselfSkinnyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CountYourselfSkinny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.my4mlife.countyourselfskinny.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CountYourselfSkinny:
    build:
      targets:
        CountYourselfSkinny: all
    run:
      storeKitConfiguration: CountYourselfSkinny.storekit
    test:
      storeKitConfiguration: CountYourselfSkinny.storekit
      targets: [CountYourselfSkinnyTests, CountYourselfSkinnyUITests]
