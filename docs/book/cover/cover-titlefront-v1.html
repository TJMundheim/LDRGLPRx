<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.cover{width:1600px;height:2560px;position:relative;overflow:hidden;font-family:'Inter',sans-serif;
  background:radial-gradient(ellipse at 50% 26%, rgba(212,175,90,.12) 0%, rgba(212,175,90,0) 55%),
  linear-gradient(170deg,#233B7A 0%,#2B4894 52%,#1d3568 100%);
  display:flex;flex-direction:column;align-items:center;text-align:center;color:#f5ecd1;padding:200px 150px}
.brand{font-size:26px;font-weight:600;letter-spacing:.36em;color:#d4af5a;text-transform:uppercase}
.brand-rule{width:200px;height:1px;background:linear-gradient(90deg,transparent,#d4af5a,transparent);margin:22px 0 90px}
.title{font-family:'Playfair Display',serif;font-weight:700;font-size:150px;line-height:1.0;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.title .mind{color:#d4af5a}
.tagline{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:42px;line-height:1.35;color:rgba(245,236,209,.92);margin-top:54px;max-width:1150px}
.mark{margin:120px 0 0}
.hook{font-family:'Inter',sans-serif;font-weight:400;font-size:33px;line-height:1.5;letter-spacing:.01em;color:rgba(245,236,209,.85);max-width:1000px;margin-top:70px}
.spacer{flex:1}
.byline{font-family:'Playfair Display',serif;font-weight:700;font-size:58px;color:#f5ecd1}
.byline-sub{font-family:'Inter',sans-serif;font-weight:500;font-size:26px;letter-spacing:.22em;color:rgba(245,236,209,.78);text-transform:uppercase;margin-top:16px}
.byline-accent{width:80px;height:2px;background:#d4af5a;margin:30px auto 0}
</style></head><body>
<div class="cover">
  <div class="brand">A My4MLife Field Guide</div>
  <div class="brand-rule"></div>
  <div class="title">Begin with the<br>End in <span class="mind">Mind</span></div>
  <div class="tagline">Don't lose your identity and your dignity<br>while you still have a choice.</div>
  <div class="mark">
    <svg width="300" height="300" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="44" r="30" fill="none" stroke="#d4af5a" stroke-width="3"/>
      <line x1="14" y1="44" x2="30" y2="44" stroke="#d4af5a" stroke-width="3"/>
      <line x1="90" y1="44" x2="106" y2="44" stroke="#d4af5a" stroke-width="3"/>
      <circle cx="60" cy="14" r="9" fill="#e9cd86"/>
      <circle cx="60" cy="74" r="7" fill="#d4af5a"/>
      <circle cx="30" cy="44" r="7" fill="#d4af5a"/>
      <circle cx="90" cy="44" r="7" fill="#d4af5a"/>
      <line x1="60" y1="81" x2="60" y2="92" stroke="#d4af5a" stroke-width="3"/>
      <text x="60" y="116" text-anchor="middle" font-family="Playfair Display, serif" font-weight="800" font-size="34" fill="#d4af5a">4M</text>
    </svg>
  </div>
  <div class="hook">A field guide to cognitive longevity — and the four systems that protect the best mind possible, through your last good day.</div>
  <div class="spacer"></div>
  <div class="byline">Dr. TJ Mundheim</div>
  <div class="byline-sub">Founder &middot; My4MLife</div>
  <div class="byline-accent"></div>
</div>
</body></html>
