<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.cover{width:1600px;height:2560px;position:relative;overflow:hidden;font-family:'Inter',sans-serif;
  background:radial-gradient(ellipse at 50% 24%, rgba(212,175,90,.13) 0%, rgba(212,175,90,0) 52%),
  linear-gradient(168deg,#243C7C 0%,#2B4894 50%,#1c3464 100%);color:#f5ecd1}
.frame{position:absolute;inset:62px;border:2px solid rgba(212,175,90,.55)}
.frame2{position:absolute;inset:74px;border:1px solid rgba(212,175,90,.30)}
.corner{position:absolute;width:30px;height:30px;border:2px solid #d4af5a}
.c-tl{top:54px;left:54px;border-right:none;border-bottom:none}
.c-tr{top:54px;right:54px;border-left:none;border-bottom:none}
.c-bl{bottom:54px;left:54px;border-right:none;border-top:none}
.c-br{bottom:54px;right:54px;border-left:none;border-top:none}
.content{position:absolute;inset:62px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:140px 140px 120px}
.brand{font-size:25px;font-weight:600;letter-spacing:.38em;color:#d4af5a;text-transform:uppercase}
.brand-rule{width:190px;height:1px;background:linear-gradient(90deg,transparent,#d4af5a,transparent);margin:22px 0 0}
.title{font-family:'Playfair Display',serif;font-weight:700;font-size:154px;line-height:1.0;letter-spacing:-.012em;text-shadow:0 2px 14px rgba(0,0,0,.4);margin-top:80px}
.title .mind{color:#d4af5a}
.tagline{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:44px;line-height:1.34;color:rgba(245,236,209,.94);margin-top:52px;max-width:1130px}
.mark{margin-top:104px}
.hook{font-family:'Inter',sans-serif;font-weight:400;font-size:31px;line-height:1.55;letter-spacing:.005em;color:rgba(245,236,209,.82);max-width:1000px;margin-top:60px}
.spacer{flex:1}
.byline{font-family:'Playfair Display',serif;font-weight:700;font-size:56px;color:#f5ecd1}
.byline-sub{font-family:'Inter',sans-serif;font-weight:500;font-size:25px;letter-spacing:.24em;color:rgba(245,236,209,.78);text-transform:uppercase;margin-top:14px}
</style></head><body>
<div class="cover">
  <div class="frame"></div><div class="frame2"></div>
  <div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>
  <div class="content">
    <div class="brand">A My4MLife Field Guide</div>
    <div class="brand-rule"></div>
    <div class="title">Begin with the<br>End in <span class="mind">Mind</span></div>
    <div class="tagline">Don't lose your identity and your dignity<br>while you still have a choice.</div>
    <div class="mark">
      <svg width="290" height="300" viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="44" r="31" fill="none" stroke="#d4af5a" stroke-width="2.5"/>
        <line x1="11" y1="44" x2="29" y2="44" stroke="#d4af5a" stroke-width="2.5"/>
        <line x1="91" y1="44" x2="109" y2="44" stroke="#d4af5a" stroke-width="2.5"/>
        <circle cx="60" cy="13" r="9.5" fill="#ecd092"/>
        <circle cx="60" cy="75" r="7" fill="#d4af5a"/>
        <circle cx="29" cy="44" r="7" fill="#d4af5a"/>
        <circle cx="91" cy="44" r="7" fill="#d4af5a"/>
        <line x1="60" y1="82" x2="60" y2="94" stroke="#d4af5a" stroke-width="2.5"/>
        <text x="60" y="120" text-anchor="middle" font-family="Playfair Display, serif" font-weight="800" font-size="36" fill="#d4af5a">4M</text>
      </svg>
    </div>
    <div class="hook">A field guide to cognitive longevity — protecting the mind, and the identity and dignity that depend on it, for every year you have left.</div>
    <div class="spacer"></div>
    <div class="byline">Dr. TJ Mundheim</div>
    <div class="byline-sub">Founder &middot; My4MLife</div>
  </div>
</div>
</body></html>
