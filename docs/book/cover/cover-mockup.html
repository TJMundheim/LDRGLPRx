<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Begin with the End in Mind — Cover Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; }
  .cover {
    width: 1600px;
    height: 2560px;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(212, 175, 90, 0.08) 0%, rgba(212, 175, 90, 0) 55%),
      linear-gradient(180deg, #0a1628 0%, #0d1b35 55%, #07111f 100%);
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    color: #f3e8c8;
  }

  /* Subtle texture overlay */
  .cover::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 25% 30%, rgba(255,255,255,0.025) 0px, transparent 2px),
                      radial-gradient(circle at 75% 70%, rgba(255,255,255,0.02) 0px, transparent 2px);
    background-size: 80px 80px, 120px 120px;
    pointer-events: none;
  }

  /* Top brand mark */
  .brand {
    position: absolute;
    top: 110px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.35em;
    color: #d4af5a;
    text-transform: uppercase;
  }

  .brand-rule {
    position: absolute;
    top: 168px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d4af5a, transparent);
  }

  /* Title block */
  .title-block {
    position: absolute;
    top: 280px;
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 110px;
  }

  .title-pretitle {
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.25em;
    color: rgba(243, 232, 200, 0.65);
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  .title-main {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 168px;
    line-height: 0.95;
    letter-spacing: -0.015em;
    color: #f5ecd1;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }

  .title-main .accent {
    display: block;
    color: #d4af5a;
    font-style: italic;
    font-weight: 700;
    font-size: 144px;
    margin-top: 12px;
  }

  /* Tagline */
  .tagline {
    position: absolute;
    top: 1000px;
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 200px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 54px;
    line-height: 1.35;
    color: rgba(243, 232, 200, 0.92);
  }

  .tagline-rule {
    position: absolute;
    top: 1230px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 2px;
    background: #d4af5a;
  }

  /* Photo */
  .photo-frame {
    position: absolute;
    bottom: 360px;
    left: 50%;
    transform: translateX(-50%);
    width: 740px;
    height: 740px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid rgba(212, 175, 90, 0.55);
    box-shadow:
      0 0 0 16px rgba(212, 175, 90, 0.08),
      0 24px 70px rgba(0, 0, 0, 0.55);
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 28%;
    filter: contrast(1.04) saturate(0.95) brightness(1.02);
  }

  /* Vignette ring around photo to integrate with bg */
  .photo-vignette {
    position: absolute;
    bottom: 240px;
    left: 50%;
    transform: translateX(-50%);
    width: 1100px;
    height: 900px;
    background: radial-gradient(ellipse at center, transparent 40%, #07111f 75%);
    pointer-events: none;
  }

  /* Author byline */
  .byline {
    position: absolute;
    bottom: 170px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 62px;
    letter-spacing: 0.005em;
    color: #f5ecd1;
  }

  .byline-sub {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.18em;
    color: rgba(243, 232, 200, 0.65);
    text-transform: uppercase;
    margin-top: 18px;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="brand">A My4MLife Field Guide</div>
  <div class="brand-rule"></div>

  <div class="title-block">
    <div class="title-pretitle">Begin with the</div>
    <div class="title-main">
      End <span class="accent">in</span> Mind
    </div>
  </div>

  <div class="tagline">
    Don't lose your identity.<br/>
    You still have a choice.
  </div>
  <div class="tagline-rule"></div>

  <div class="photo-frame">
    <img src="../../../website/public/images/founder/founder-tj.jpg" alt="Dr. TJ Mundheim">
  </div>
  <div class="photo-vignette"></div>

  <div class="byline">
    Dr. TJ Mundheim
    <div class="byline-sub">Founder &middot; My4MLife</div>
  </div>
</div>
</body>
</html>
